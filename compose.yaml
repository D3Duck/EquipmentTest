name: equipment

services:
  postgres:
    image: postgres:15.14
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Australia/Sydney}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 3s
      timeout: 5s
      retries: 10

  atlas:
    image: arigaio/atlas:0.38.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/database/migrations:/migrations:ro
    command:
      - migrate
      - apply
      - --dir
      - file:///migrations
      - --url
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    restart: "no"

  app-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: equipment-hire/backend:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_VERSION: ${APP_VERSION:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      GO_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      TZ: ${TZ:-Australia/Sydney}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${GO_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      atlas:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
